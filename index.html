<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101822"><meta name="description" content="Test your cybersecurity knowledge with 15 multiple-choice questions and detailed explanations."><title>CyberSense — Cybersecurity Quiz</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0c121b;color:#edf4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#183340 0,transparent 48%);min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #96f3d1;outline-offset:4px}header{max-width:1100px;margin:auto;padding:28px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #263443}.brand{font-weight:800;font-size:22px;letter-spacing:-.8px}.brand span{color:#69e8b9}.tag{font-size:12px;color:#a9bacc;letter-spacing:1.5px}main{max-width:800px;margin:62px auto;padding:0 24px 60px}.eyebrow{color:#69e8b9;letter-spacing:2px;font-size:12px;font-weight:700}h1{font-size:clamp(36px,6vw,58px);letter-spacing:-2px;line-height:1.1;margin:18px 0}p{color:#a9bacc;line-height:1.7}.card{background:#131d29;border:1px solid #2a3849;border-radius:22px;padding:32px;box-shadow:0 18px 65px #0003}.stats{display:flex;gap:30px;padding:24px 0 30px}.stats strong{display:block;font-size:23px}.stats span{font-size:12px;color:#a9bacc}.primary{border:0;border-radius:12px;background:#69e8b9;color:#09231c;padding:15px 26px;font-weight:750}.secondary{border:1px solid #465769;background:transparent;color:#edf4ff;border-radius:12px;padding:14px 22px}.primary:disabled{background:#334653;color:#93a2b1;cursor:not-allowed}.topline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#b4c4d4;margin-bottom:16px}.progress{height:6px;border-radius:10px;background:#293646;margin-bottom:32px}.progress div{height:100%;background:#69e8b9;border-radius:10px;transition:width .2s}h2{font-size:clamp(23px,4vw,30px);line-height:1.35;letter-spacing:-.6px;margin:12px 0 26px}.options{display:grid;gap:12px}.option{display:flex;align-items:center;gap:15px;text-align:left;width:100%;border:1px solid #344355;border-radius:12px;padding:16px;color:#e3ecf5;background:#172230;line-height:1.45}.option:hover:not(:disabled){border-color:#69e8b9;background:#1a3033}.letter{display:grid;place-items:center;flex:0 0 30px;height:30px;border:1px solid #425267;border-radius:8px;font-size:13px;color:#b1c1d1}.selected{border-color:#69e8b9;background:#193632}.correct{border-color:#69e8b9;background:#193632}.wrong{border-color:#f19191;background:#402a32}.option:disabled{cursor:default;opacity:1}.feedback{border-left:3px solid #69e8b9;padding:3px 18px;margin-top:24px}.feedback strong{color:#69e8b9}.feedback p{margin:8px 0}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px;align-items:center}.muted{font-size:12px;color:#a9bacc}.result{text-align:center}.score{font-size:78px;letter-spacing:-5px;color:#69e8b9;font-weight:850;margin:24px 0 0}.score small{font-size:28px;letter-spacing:0;color:#a9bacc}.review{margin-top:32px}.review article{padding:22px 0;border-bottom:1px solid #2a3849}.review h3{font-size:17px;margin:0 0 12px;line-height:1.5}.review p{margin:6px 0;font-size:14px}.good{color:#69e8b9}.bad{color:#f19191}footer{text-align:center;font-size:12px;color:#718397;padding:24px}.hidden{display:none}@media(max-width:600px){main{margin:32px auto;padding:0 16px 30px}.card{padding:22px}header{padding:22px 16px}.tag{font-size:10px}.stats{gap:24px}.actions{flex-wrap:wrap}}
</style></head><body><header><div class="brand">◈ Cyber<span>Sense</span></div><div class="tag">THINK BEFORE YOU CLICK</div></header><main id="app"></main><footer>Stay curious. Stay secure. • CyberSense</footer>
<script>
const questions=[
{topic:'Phishing',q:'You receive an urgent email asking you to verify your bank password through a link. What should you do?',o:['Click the link and enter your password','Reply with your account details','Open the bank’s official app or type its known address to check','Forward it to friends to see if it works'],a:2,e:'Verify requests through a trusted channel. Urgency and requests for credentials are common phishing signals.'},
{topic:'Passwords',q:'Which is the strongest approach to securing your accounts?',o:['Use one complex password everywhere','Use unique, long passwords stored in a password manager','Use your birthday with an exclamation mark','Change between two short passwords'],a:1,e:'Long, unique passwords limit credential reuse attacks. A password manager helps generate and store them.'},
{topic:'Authentication',q:'Which example uses two different authentication factors?',o:['A password and a PIN','Two security questions','A password and a code from an authenticator app','A username and a password'],a:2,e:'A password is something you know; an authenticator app proves possession of a device or secret. A username is an identifier, not a secret factor.'},
{topic:'Malware',q:'What does ransomware typically do?',o:['Encrypts or blocks access to data and demands payment','Improves a computer’s performance','Automatically patches vulnerable software','Filters advertising from websites'],a:0,e:'Ransomware blocks access to systems or files and demands payment. Some attacks also steal data and threaten to publish it.'},
{topic:'Web security',q:'What does HTTPS primarily protect?',o:['It guarantees a website is honest','It prevents all malware downloads','It hides the website from your internet provider','It encrypts data in transit between your browser and the website'],a:3,e:'HTTPS protects the connection. A phishing or malicious website can also use HTTPS, so it does not guarantee trustworthy content.'},
{topic:'Networks',q:'What is the main purpose of a firewall?',o:['Store copies of all your files','Filter network traffic according to security rules','Generate passwords for websites','Remove every type of virus'],a:1,e:'Firewalls permit or block traffic based on rules. They are one layer of security, not a replacement for other protections.'},
{topic:'Social engineering',q:'Someone claiming to be IT support calls and asks for your login code. What is the safest response?',o:['Share it if they know your name','Share it only if they sound professional','Refuse and verify the request through your official IT channel','Post the code in a team chat'],a:2,e:'Attackers can impersonate support staff and know personal details. Never share login codes; verify independently.'},
{topic:'Access control',q:'What does the principle of least privilege mean?',o:['Give users only the access needed for their tasks','Give every employee administrator access','Remove all authentication checks','Share one account with the whole team'],a:0,e:'Limiting permissions reduces the damage possible from mistakes, compromised accounts, and malicious actions.'},
{topic:'Software updates',q:'Why are security updates important?',o:['They guarantee a device can never be hacked','They make passwords unnecessary','They only change how apps look','They fix known vulnerabilities attackers could exploit'],a:3,e:'Security patches close known weaknesses. Applying them promptly reduces exposure, although no update eliminates every risk.'},
{topic:'Web attacks',q:'Which practice helps prevent SQL injection?',o:['Hide the database name','Use parameterized queries or prepared statements','Make the login page a different color','Store passwords as plain text'],a:1,e:'Parameterized queries separate data from SQL commands, preventing user input from being interpreted as executable query structure.'},
{topic:'Backups',q:'Which backup strategy best helps you recover from ransomware?',o:['Keep only one copy on your computer','Keep all backups permanently mounted and writable','Keep tested backups with an offline or immutable copy','Assume cloud sync always preserves deleted files'],a:2,e:'Offline or immutable backups are harder for ransomware to alter. Test restoration, because an unverified backup may not be usable.'},
{topic:'Privacy',q:'A flashlight app requests access to your contacts. What should you do?',o:['Question the need and deny unnecessary permission','Allow every permission for convenience','Upload your contacts publicly','Disable the device’s screen lock'],a:0,e:'Grant permissions based on the app’s actual purpose. Unnecessary permissions can expose personal information.'},
{topic:'Public Wi-Fi',q:'When using public Wi-Fi, which action reduces risk?',o:['Ignore browser certificate warnings','Disable HTTPS','Share your device with strangers','Use HTTPS and avoid untrusted networks for sensitive activity'],a:3,e:'HTTPS protects data in transit. Prefer a trusted network for sensitive tasks and never bypass certificate warnings.'},
{topic:'Incident response',q:'You accidentally enter your work password on a suspicious website. What should you do next?',o:['Wait to see whether anything happens','Report it promptly and change the password through the official service','Delete the browser history and keep quiet','Send the attacker a different password'],a:1,e:'Prompt reporting helps your security team contain the incident. Change the password safely and follow their instructions about sessions and account recovery.'},
{topic:'Availability',q:'What is a distributed denial-of-service (DDoS) attack?',o:['A method for encrypting backup files','A secure way to distribute software','Traffic from many sources overwhelms a service and disrupts access','An attempt to guess one user’s password'],a:2,e:'DDoS attacks target availability by exhausting network or service resources with traffic from multiple sources.'}
];
let index=0,selected=null,locked=false,answers=[];const app=document.getElementById('app');
function home(){app.innerHTML='<div class="eyebrow">THE CYBERSECURITY CHALLENGE</div><h1>How secure is<br>your knowledge?</h1><p>Spot the scams. Protect your accounts. Put your everyday cybersecurity instincts to the test.</p><div class="card"><div class="stats"><div><strong>15</strong><span>Questions</span></div><div><strong>4</strong><span>Choices each</span></div><div><strong>~5 min</strong><span>No time limit</span></div></div><p>Choose one answer per question. Get immediate feedback, then review your complete scorecard.</p><button class="primary" id="start">Start the challenge →</button><p class="muted">No sign-up. No pressure. Just a smarter, safer you.</p></div>';document.getElementById('start').onclick=()=>{index=0;answers=[];selected=null;locked=false;render()}}
function render(){const q=questions[index];app.innerHTML='<div class="topline"><span>Question '+(index+1)+' of 15</span><span>'+answers.filter((a,i)=>a===questions[i].a).length+' correct</span></div><div class="progress"><div style="width:'+((index)/15*100)+'%"></div></div><section class="card" aria-labelledby="question"><div class="eyebrow">'+q.topic+'</div><h2 id="question" tabindex="-1">'+q.q+'</h2><div class="options" role="group" aria-label="Answer choices">'+q.o.map((o,i)=>'<button class="option" data-choice="'+i+'" aria-pressed="false"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>').join('')+'</div><div id="feedback" aria-live="polite"></div><div class="actions"><span class="muted">Select your best answer</span><button class="primary" id="submit" disabled>Check answer</button></div></section>';app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;selected=Number(b.dataset.choice);app.querySelectorAll('[data-choice]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});document.getElementById('submit').disabled=false});document.getElementById('submit').onclick=submit;document.getElementById('question').focus()}
function submit(){if(locked){index++;selected=null;locked=false;if(index===questions.length)results();else render();return}if(selected===null)return;locked=true;answers.push(selected);const q=questions[index];app.querySelectorAll('[data-choice]').forEach(b=>{let i=Number(b.dataset.choice);b.disabled=true;b.classList.remove('selected');if(i===q.a)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});document.getElementById('feedback').innerHTML='<div class="feedback"><strong>'+(selected===q.a?'Correct — nice work!':'Not quite — here’s why')+'</strong><p>'+q.e+'</p></div>';const btn=document.getElementById('submit');btn.textContent=index===14?'See my results →':'Next question →';btn.focus()}
function results(){const score=answers.filter((a,i)=>a===questions[i].a).length;const title=score>=13?'Excellent security instincts.':score>=9?'A solid foundation.':'Every answer is a chance to learn.';app.innerHTML='<section class="card result"><div class="eyebrow">CHALLENGE COMPLETE</div><div class="score">'+score+'<small> / 15</small></div><h2 tabindex="-1" id="resultTitle">'+title+'</h2><p>You scored '+Math.round(score/15*100)+'%. Review your answers below and keep building safer habits.</p><button class="primary" id="retry">Try again ↻</button> <button class="secondary" id="review">Review answers ↓</button></section><section class="card review" id="answerReview"><h2>Your answer breakdown</h2>'+questions.map((q,i)=>'<article><h3><span class="'+(answers[i]===q.a?'good':'bad')+'">'+(answers[i]===q.a?'✓':'✕')+'</span> '+(i+1)+'. '+q.q+'</h3><p>Your answer: '+q.o[answers[i]]+'</p>'+(answers[i]!==q.a?'<p class="good">Correct answer: '+q.o[q.a]+'</p>':'')+'<p>'+q.e+'</p></article>').join('')+'</section>';document.getElementById('retry').onclick=home;document.getElementById('review').onclick=()=>document.getElementById('answerReview').scrollIntoView({behavior:'smooth'});window.scrollTo(0,0);document.getElementById('resultTitle').focus()}
home();
</script></body></html>
